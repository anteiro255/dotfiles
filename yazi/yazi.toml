[opener]
edit = [
	{ run = 'helix %s', desc = "helix", block = true},
	{ run = 'micro %s', desc = "micro", block = true},
	{ run = 'zeditor %s', desc = "zed", orphan = true},
	{ run = 'xdg-open %s', desc = "xdg-open" },

]
open = [
	{ run = 'xdg-open %s', desc = "xdg-open" },
	{ run = 'imv-dir %s', desc = "imv", orphan = true},
	{ run = 'clapper %s', desc = "clapper"},
]

[open]
rules = [  
  { mime = "video/*", use = "open" },
  { mime = "audio/*", use = "open" },
  
  { mime = "image/*", use = "open" },

  { mime = "application/*", use = "edit" },
  { mime = "text/*", use = "edit" },
  { mime = "*", use = "edit" }, # for files without extension
]
