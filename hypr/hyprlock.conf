general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
}

auth {
    fingerprint {
        enabled = true
        retry_delay = 250
    }
}

# background
background {
    monitor =

    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(242, 243, 244, 0.75)
    font_size = 95
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_fade_on_empty = false
    
    # The Catppuccin / Modern style
    outer_color = rgba(180, 190, 254, 0.5)
    inner_color = rgba(30, 30, 46, 0.6)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false

    font_family = JetBrains Mono Nerd Font Bold
    font_size = 18

    placeholder_text = <span foreground="##cdd6f4"><i>Input the password...</i></span>
    hide_input = false
    
    position = 0, -50
    halign = center
    valign = center
}
label {
    monitor =
    text = $LAYOUT[us, ru]
    color = rgb(205, 214, 244)
    font_size = 10
    font_family = JetBrains Mono Nerd Font Bold

    position = -40, 40
    halign = right
    valign = bottom
}
